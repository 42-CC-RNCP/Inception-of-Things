# bonus/manifests/argocd/application-dev.tmpl.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bonus-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: ${REPO_URL}
    targetRevision: ${REVISION}
    path: ${APP_PATH}
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
